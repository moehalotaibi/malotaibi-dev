<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427">
  <rect width="640" height="427" fill="#006c35"/>
  <!-- Shahada text -->
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="72" fill="white" text-anchor="middle" font-weight="bold">لا إله إلا الله</text>
  <text x="320" y="260" font-family="Arial, sans-serif" font-size="56" fill="white" text-anchor="middle" font-weight="bold">محمد رسول الله</text>
  <!-- Sword -->
  <g fill="white" transform="translate(320, 310)">
    <!-- Blade -->
    <polygon points="-120,0 120,0 100,12 -100,12" transform="translate(0, 10)"/>
    <!-- Handle -->
    <rect x="-8" y="-30" width="16" height="35" rx="3"/>
    <!-- Guard -->
    <rect x="-35" y="-5" width="70" height="10" rx="3"/>
    <!-- Pommel -->
    <ellipse cx="0" cy="-32" rx="12" ry="8"/>
  </g>
</svg>
